# Local development environment.
#
#   docker compose up --build        # everything;  api on :8080, web on :5173
#   docker compose exec api yarn cli dev-token you@example.com
#
# Data persists in ./.data (postgres, firebase emulator accounts, blobs).

name: cochlea

x-node: &node
  build:
    context: .
    dockerfile: docker/node.Dockerfile
  image: cochlea-node-dev
  working_dir: /app
  volumes:
    - ./:/app
    - node_modules:/app/node_modules
    - api_node_modules:/app/api/node_modules
    - web_node_modules:/app/web/node_modules
    - shared_node_modules:/app/shared/node_modules
    # built in-container, so the host's shared/dist is never written as root
    - shared_dist:/app/shared/dist
    - yarn_cache:/yarn-cache

x-db-env: &db-env
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: cochlea
  PGPASSWORD: cochlea
  PGDATABASE: cochlea

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cochlea
      POSTGRES_PASSWORD: cochlea
      POSTGRES_DB: cochlea
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cochlea -d cochlea"]
      interval: 2s
      timeout: 3s
      retries: 30

  firebase:
    build: ./firebase
    ports:
      - "${FIREBASE_AUTH_PORT:-9099}:9099"
      - "${FIREBASE_UI_PORT:-4000}:4000"
    volumes:
      - ./.data/firebase:/data
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9099/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 60

  gcs:
    image: fsouza/fake-gcs-server:1.52.2
    command:
      - -scheme=http
      - -port=4443
      - -external-url=http://localhost:${GCS_PORT:-4443}
      - -public-host=localhost:${GCS_PORT:-4443}
      - -backend=filesystem
      - -filesystem-root=/storage
    ports:
      - "${GCS_PORT:-4443}:4443"
    volumes:
      - ./.data/gcs:/storage

  install:
    <<: *node
    command: yarn install --frozen-lockfile --non-interactive

  migrate:
    <<: *node
    command: yarn workspace @cochlea/api migrate
    environment:
      <<: *db-env
    depends_on:
      install:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  api:
    <<: *node
    command: yarn workspace @cochlea/api dev
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      <<: *db-env
      PORT: "8080"
      PUBLIC_BASE_URL: http://localhost:${API_PORT:-8080}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-5173}
      FIREBASE_PROJECT_ID: demo-cochlea
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
      GCS_API_ENDPOINT: http://gcs:4443
      BLOB_BUCKET: cochlea-blobs
      BLOB_CREATE_BUCKET: "true"
      BLOB_PUBLIC_URL_TEMPLATE: http://localhost:${GCS_PORT:-4443}/storage/v1/b/cochlea-blobs/o/{key}?alt=media
    depends_on:
      migrate:
        condition: service_completed_successfully
      firebase:
        condition: service_healthy
      gcs:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 60

  web:
    <<: *node
    command: yarn workspace @cochlea/web dev --host 0.0.0.0 --port 5173
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8080}/v1
      VITE_FIREBASE_PROJECT_ID: demo-cochlea
      VITE_FIREBASE_AUTH_EMULATOR_URL: http://localhost:${FIREBASE_AUTH_PORT:-9099}
    depends_on:
      install:
        condition: service_completed_successfully

  # one-shot: builds the codec's WebAssembly decoder into web/public/codec/
  # (for the hidden /labs/codec page).  Rebuild with `docker compose run --rm codec`
  # or `yarn build-codec` (needs a local Rust toolchain).
  codec:
    build:
      context: .
      dockerfile: docker/rust.Dockerfile
    image: cochlea-rust-dev
    working_dir: /app
    command: sh codec/build-wasm.sh
    environment:
      CARGO_TARGET_DIR: /cargo-target
    volumes:
      - .:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_target:/cargo-target

  # one-shot: creates the featurebot user and an API key for it, the first
  # time only (kept in .data/bots/featurebot.key; see bots/featurebot/issue-key.sh)
  featurebot-key:
    <<: *node
    command: sh bots/featurebot/issue-key.sh
    environment:
      <<: *db-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  # follows the sound feed, annotating every new sound (bots/featurebot).
  # Audio under AUDIO_DATA_DIR (see .env.example) is read from disk instead of
  # being downloaded.
  featurebot:
    build:
      context: .
      dockerfile: docker/featurebot.Dockerfile
    image: cochlea-featurebot-dev
    command: python bots/featurebot/featurebot.py
    volumes:
      - ./:/app:ro
      - ${AUDIO_DATA_DIR:-./.data/audio-data}:/audio:ro
    environment:
      COCHLEA_API_URL: http://api:8080/v1
      COCHLEA_API_KEY_FILE: /app/.data/bots/featurebot.key
      FEATUREBOT_MIRRORS: "https://music-net.s3.us-east-1.amazonaws.com/=/audio/musicnet/train_data/{}.wav;https://music-net.s3.us-east-1.amazonaws.com/=/audio/musicnet/test_data/{}.wav"
    depends_on:
      api:
        condition: service_healthy
      featurebot-key:
        condition: service_completed_successfully
    # an invalid key exits non-zero (2); don't retry that forever
    restart: on-failure:3

volumes:
  cargo_registry:
  cargo_target:
  node_modules:
  api_node_modules:
  web_node_modules:
  shared_node_modules:
  shared_dist:
  yarn_cache:
